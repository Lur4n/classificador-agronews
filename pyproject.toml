[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "classificador-agronews"
version = "0.1.0"
description = "Modulo stateless em Python para classificacao de noticias do agronegocio via Gemini API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Luan Carlos dos Santos" }
]
dependencies = [
    "google-genai>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["classificador_agronews*"]